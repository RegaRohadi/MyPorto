<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="TriAgent logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#141b33"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="18" y="18" width="476" height="476" rx="80" fill="none" stroke="#243052" stroke-width="4"/>

  <!-- connections -->
  <g stroke="#2d3b66" stroke-width="10" stroke-linecap="round">
    <path d="M256 148 L158 352"/>
    <path d="M256 148 L354 352"/>
    <path d="M158 352 L354 352"/>
    <path d="M256 148 L256 280"/>
  </g>

  <!-- core -->
  <g filter="url(#glow)">
    <circle cx="256" cy="280" r="42" fill="url(#core)"/>
    <circle cx="256" cy="280" r="17" fill="#e6f7ff"/>
  </g>

  <!-- three agents -->
  <g filter="url(#glow)">
    <circle cx="256" cy="140" r="40" fill="#34d399"/>
    <circle cx="152" cy="362" r="40" fill="#60a5fa"/>
    <circle cx="360" cy="362" r="40" fill="#fbbf24"/>
  </g>

  <!-- glyphs -->
  <g fill="#07101f">
    <rect x="240" y="124" width="32" height="22" rx="4"/>
    <path d="M240 128 L256 143 L272 128"/>
    <rect x="139" y="352" width="26" height="20" rx="3"/>
    <circle cx="152" cy="362" r="6" fill="#60a5fa" opacity="0"/>
    <rect x="345" y="351" width="30" height="22" rx="3"/>
    <rect x="350" y="356" width="20" height="3" fill="#fbbf24"/>
    <rect x="350" y="363" width="14" height="3" fill="#fbbf24"/>
  </g>
</svg>
